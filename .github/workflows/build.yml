# .github/workflows/build.yml
name: Build Binaries

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version (e.g., v1.0.0)'
        required: true
        default: 'v1.0.0'

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

permissions:
  contents: write
  
jobs:
  build:
    strategy:
      matrix:
        os: [ ubuntu-latest, windows-latest ]

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout main repo
        uses: actions/checkout@v4

      - name: Normalize Version String
        id: norm_version
        shell: bash
        run: |
          RAW_VERSION="${{ github.event.inputs.version }}"
          CLEAN_VERSION="${RAW_VERSION#v}"
          echo "clean=$CLEAN_VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=v$CLEAN_VERSION" >> "$GITHUB_OUTPUT"

      - name: Inject Version into Python Files
        shell: bash
        run: |
          VERSION="${{ steps.norm_version.outputs.clean }}"
          echo "Applying version: $VERSION"
          sed -i "s/VERSION_PLACEHOLDER/$VERSION/g" OSCLeash.py setup.py

      # --- Python Setup ---
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies (Windows)
        if: runner.os == 'Windows'
        env:
          VGAMEPAD_SKIP_VIGEMBUS_INSTALL: true
        shell: pwsh
        run: |
          pip install vgamepad@git+https://github.com/yannbouteiller/vgamepad.git
          pip install -r requirements.txt
          pip install cx_Freeze freeze-core nuitka pyinstaller

      - name: Install dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          pip install -r requirements.txt
          pip install cx_Freeze

      # --- Installers (cx_Freeze) ---
      - name: Build with CX_Freeze (Linux)
        if: runner.os == 'Linux'
        run: |
          python setup.py bdist_appimage
        
      - name: Build with CX_Freeze (Windows)
        if: runner.os == 'Windows'
        shell: cmd
        run: |
          python setup.py bdist_msi

      # --- Nuitka - Default exe
      - name: Build with nuitka (windows)
        if: runner.os == 'Windows'
        shell: cmd
        run: |
          python -m nuitka --assume-yes-for-downloads --output-dir=dist --output-filename=OSCLeash.exe --mode=onefile --windows-icon-from-ico=Resources\VRChatOSCLeash.ico --no-prefer-source-code OSCLeash.py

      # --- PyInstaller - Fallback exe
      - name: Build with pyinstaller (windows)
        if: runner.os == 'Windows'
        shell: cmd
        run: |
          pyinstaller --workpath=pyinstallbuild --distpath=dist -i Resources\VRChatOSCLeash.ico -n OSCLeash-Py -F OSCLeash.py

      # --- Upload ---
      - name: Upload binary
        uses: actions/upload-artifact@v6
        with:
          name: binaries-${{ matrix.os }}
          path: |
            dist/OSCLeash.exe
            dist/OSCLeash-Py.exe
            dist/OSCLeash-Installer.msi
            dist/OSCLeash-Linux.AppImage
          retention-days: 10

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.norm_version.outputs.tag }}
          name: ${{ steps.norm_version.outputs.tag }}
          generate_release_notes: true
          files: |
            dist/OSCLeash.exe
            dist/OSCLeash-Py.exe
            dist/OSCLeash-Installer.msi
            dist/OSCLeash-Linux.AppImage